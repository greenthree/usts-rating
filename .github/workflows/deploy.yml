name: Deploy USTS Rating System to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Contest Data & Users
        run: |
          python scripts/validate_data.py

      - name: Run Pytest Unit Tests
        run: |
          pytest tests/ -v

      - name: Recalculate Rating Database
        run: |
          python scripts/recalculate.py

      - name: Assemble Static Distribution
        run: |
          mkdir -p dist/data
          cp -r web/* dist/
          # Ensure rating_db.json is present in dist/data/ and web/data/
          if [ -f web/data/rating_db.json ]; then
            cp web/data/rating_db.json dist/data/rating_db.json
          fi
          if [ -f dist/data/rating_db.json ]; then
            mkdir -p web/data
            cp dist/data/rating_db.json web/data/rating_db.json
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
